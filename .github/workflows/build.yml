name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'Run the iOS TestFlight build (burns macOS minutes)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------
  # logic-test: pure-Lua unit tests, no LÖVE runtime needed.
  # -----------------------------------------------------------------
  logic-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run logic tests
        run: |
          lua5.1 tests/test_logic.lua
          lua5.1 targets/paddle/tests/test_logic.lua

  # -----------------------------------------------------------------
  # battle-test: the headless battle simulation in battle/. Pure Lua,
  # no LÖVE runtime, no display. Covers sequential resolution order,
  # blowback hitting friendly marbles, both win conditions, and the
  # seed-determinism check.
  #
  # battle/ is shipped by every client build, so its headless suite gates
  # packaging alongside the presentation-adapter suite.
  # -----------------------------------------------------------------
  battle-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run battle simulation tests
        run: lua5.1 battle/tests/run_all.lua
      - name: Verify the CLI harness runs a battle from a seed
        run: lua5.1 battle/cli.lua --seed 20260726 --quiet
      - name: Verify the same seed replays identically across processes
        run: |
          lua5.1 battle/cli.lua --seed 20260726 > /tmp/battle-run-1.log
          lua5.1 battle/cli.lua --seed 20260726 > /tmp/battle-run-2.log
          diff /tmp/battle-run-1.log /tmp/battle-run-2.log

  # -----------------------------------------------------------------
  # web + desktop matrix: both run on ubuntu-latest in parallel.
  # -----------------------------------------------------------------
  build:
    needs: [logic-test, battle-test]
    strategy:
      fail-fast: false
      matrix:
        target: [web, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js (web target)
        if: matrix.target == 'web'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux build prereqs
        run: sudo apt-get update && sudo apt-get install -y zip unzip curl shellcheck

      - name: Build web
        if: matrix.target == 'web'
        run: ./scripts/build-web.sh

      - name: Build candidate-owned paddle web target
        if: matrix.target == 'web'
        run: ./scripts/build-paddle-web.sh

      - name: Verify release container
        if: matrix.target == 'web'
        env:
          CALLACK_CONTAINER_ENGINE: docker
        run: bash scripts/verify-release-container.sh

      - name: Verify reproducible web artifacts
        if: matrix.target == 'web'
        run: |
          bash scripts/verify-web-reproducible.sh
          bash scripts/verify-paddle-web-reproducible.sh

      - name: Verify exact web build identity controls
        if: matrix.target == 'web'
        run: |
          npm run verify:web:identity
          npm run verify:paddle:identity

      - name: Verify tracked browser evidence freshness
        if: matrix.target == 'web'
        run: npm run verify:evidence

      - name: Verify shell scripts
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh

      - name: Install packaged-browser verifier
        if: matrix.target == 'web'
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify packaged browser at phone and desktop viewports
        if: matrix.target == 'web'
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
        run: |
          npm run test:shore-browser
          npm run verify:shore-local
          npm run verify:web
          npm run verify:paddle:browser
          npm run verify:evidence -- --working-tree --compare-tracked

      - name: Build desktop (Linux + Windows)
        if: matrix.target == 'desktop'
        run: ./scripts/build-desktop.sh --windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: collack-spike-${{ matrix.target }}
          path: |
            dist/web
            dist/paddle-web
            dist/desktop
            dist/verification
            dist/collack-spike.love
            dist/collack-paddle.love
          if-no-files-found: ignore
          retention-days: 14

  # -----------------------------------------------------------------
  # iOS — gated. Only runs when manually dispatched with build_ios=true,
  # or when a PR carries the 'ios-build' label. Keeps macOS minutes down.
  # -----------------------------------------------------------------
  ios:
    needs: build
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_ios == 'true') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ios-build'))
    runs-on: macos-latest
    environment: ios
    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      GIT_AUTHORIZATION: ${{ secrets.GIT_AUTHORIZATION }}
      TEMP_KEYCHAIN_PASSWORD: ${{ secrets.TEMP_KEYCHAIN_PASSWORD }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
      APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
      DEVELOPER_APP_IDENTIFIER: ${{ secrets.DEVELOPER_APP_IDENTIFIER }}
      DEVELOPER_PORTAL_TEAM_ID: ${{ secrets.DEVELOPER_PORTAL_TEAM_ID }}
      APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build candidate-owned paddle web bundle
        run: ./scripts/build-paddle-web.sh

      - name: Wrap in Capacitor
        run: ./scripts/build-ios.sh

      - name: Verify generated iOS scaffold
        run: test -f capacitor/ios/App/Gemfile

      - name: Setup Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.6'
          bundler-cache: true
          working-directory: 'capacitor/ios/App'

      - name: Setup Keychain
        run: |
          security create-keychain -p "$TEMP_KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$TEMP_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings

      - name: Install iOS deps (CocoaPods)
        working-directory: capacitor/ios/App
        run: |
          bundle install
          pod install

      - name: Deploy to TestFlight via Fastlane
        working-directory: capacitor/ios/App
        run: bundle exec fastlane closed_beta

      - name: Clean up keychain
        if: always()
        run: security delete-keychain build.keychain || true
