<!doctype html>
<!--
  Responsive shell for the Collack love.js bundle.
  Replaces the stock love.js index.html with a phone-native portrait stage.
  This template is copied
  into dist/web/ by scripts/build-web.sh AFTER love.js generates its output, so
  it intentionally overrides theme/love.css via inline <style>.
-->
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Callack Auto-Battler</title>

    <!-- love.js still ships theme/love.css; override the bits that fight responsiveness. -->
    <link rel="stylesheet" type="text/css" href="theme/love.css">
    <style>
      /* Reset stock love.js theme background (pink/cyan triangle bg.png) and
         center-align flow that pushes the canvas offscreen on mobile portrait. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        background-image: none !important;
        color: #ddd;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh; /* dynamic viewport, dodges iOS Safari URL-bar jank */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      /* The stage keeps the 390x844 game surface pixel-perfect on a phone and
         scales it uniformly into desktop windows. */
      #stage {
        position: relative;
        width: min(100vw, calc(100vh * 390 / 844));
        width: min(100dvw, calc(100dvh * 390 / 844));
        height: min(100vh, calc(100vw * 844 / 390));
        height: min(100dvh, calc(100dvw * 844 / 390));
        max-width: 100vw;
        max-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }

      /* Stock love.js gives #canvas { visibility: hidden }. We keep that, but
         size it responsively so when love.js flips it visible on init it fills
         the stage. */
      #canvas, #loadingCanvas {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 390 / 844;
        background: #000;
        border: 0;
        padding: 0;
        margin: 0;
        outline: none;
        image-rendering: pixelated;
        /* Let the two in-canvas controls receive taps without a page gesture. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* Hide the stock loadingCanvas — it draws offscreen text on mobile.
         We render loading state via DOM (#loading) instead. */
      #loadingCanvas {
        display: none !important;
      }

      /* DOM-rendered loading overlay. Sits on top of the stage until love.js
         flips #canvas visible. */
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        font-size: 1rem;
        color: #aaa;
        background: #000;
        text-align: center;
        padding: 1rem;
        pointer-events: none;
      }
      #loading.hidden { display: none; }
      #loading-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #333;
        border-top-color: #8ec3e3;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

    </style>
  </head>
  <body>
    <div id="stage">
      <!-- love.js expects both canvases in the DOM. loadingCanvas is hidden via CSS;
           we use the DOM #loading element for progress instead. -->
      <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()"></canvas>
      <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
      <div id="loading">
        <div id="loading-spinner"></div>
        <div id="loading-text">Loading…</div>
      </div>
    </div>

    <script type='text/javascript'>
      // Stock love.js shell expects drawLoadingText() on the loadingCanvas.
      // We redirect it to the DOM #loading-text element so progress is visible
      // on mobile (the stock loadingCanvas can draw progress offscreen).
      function drawLoadingText(text) {
        var el = document.getElementById('loading-text');
        if (el) el.textContent = text || 'Loading…';
      }

      window.onload  = function () { window.focus(); };
      window.onclick = function () { window.focus(); };

      // Block default scroll for game-relevant keys.
      window.addEventListener("keydown", function(e) {
        if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
      }, false);

      var HAS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
      var LOVE_ARGS = ["./game.love"];
      if (HAS_TOUCH) LOVE_ARGS.push("--touch");

      var Module = {
        arguments: LOVE_ARGS,
        INITIAL_MEMORY: 67108864,
        printErr: console.error.bind(console),
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", function(e) {
            alert('WebGL context lost. You will need to reload the page.');
            e.preventDefault();
          }, false);
          return canvas;
        })(),
        setStatus: function(text) {
          if (text) {
            drawLoadingText(text);
          } else if (Module.remainingDependencies === 0) {
            // love.js init done — hide the DOM loader, reveal the canvas.
            var loading = document.getElementById('loading');
            if (loading) loading.classList.add('hidden');
            document.getElementById('canvas').style.visibility = 'visible';
          }
        },
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies: function(left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left
            ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')'
            : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading…');

      window.onerror = function(event) {
        Module.setStatus('Exception thrown — see JavaScript console');
        Module.setStatus = function(text) {
          if (text) Module.printErr('[post-exception status] ' + text);
        };
      };

      var applicationLoad = function(e) { Love(Module); }
    </script>
    <script type="text/javascript" src="__GAME_JS__"></script>
    <script async type="text/javascript" src="__LOVE_JS__" onload="applicationLoad(this)"></script>
  </body>
</html>
