<!doctype html>
<!--
  Responsive shell for the Collack love.js bundle.
  Replaces the stock love.js index.html with a phone-native portrait stage.
  This template is copied
  into dist/web/ by scripts/build-web.sh AFTER love.js generates its output, so
  it intentionally overrides theme/love.css via inline <style>.
-->
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#241A14">
    <title>Collack — Brickbreaker Autobattler</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2318271f'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23e3bd66'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23fff4db' stroke-width='2'/%3E%3C/svg%3E">
    <meta name="description" content="Build a formation, collect powerful marbles, and watch the ricochets decide. A brickbreaker autobattler with three rivals and a new upgrade after every victory.">

    <!-- love.js still ships theme/love.css; override the bits that fight responsiveness. -->
    <link rel="stylesheet" type="text/css" href="theme/love.css">
    <style>
      /* Reset stock love.js theme background (pink/cyan triangle bg.png) and
         center-align flow that pushes the canvas offscreen on mobile portrait. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0C0907;
        background-image: none !important;
        color: #ddd;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh; /* dynamic viewport, dodges iOS Safari URL-bar jank */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      /* The stage keeps the 390x844 game surface pixel-perfect on a phone and
         scales it uniformly into desktop windows. */
      #stage {
        position: relative;
        width: min(100vw, calc(100vh * 390 / 844));
        width: min(100dvw, calc(100dvh * 390 / 844));
        height: min(100vh, calc(100vw * 844 / 390));
        height: min(100dvh, calc(100dvw * 844 / 390));
        max-width: 100%;
        max-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #241A14;
      }

      /* Stock love.js gives #canvas { visibility: hidden }. We keep that, but
         size it responsively so when love.js flips it visible on init it fills
         the stage. */
      #canvas, #loadingCanvas {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 390 / 844;
        background: #241A14;
        border: 0;
        padding: 0;
        margin: 0;
        outline: none;
        image-rendering: pixelated;
        /* Let the two in-canvas controls receive taps without a page gesture. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* Hide the stock loadingCanvas — it draws offscreen text on mobile.
         We render loading state via DOM (#loading) instead. */
      #loadingCanvas {
        display: none !important;
      }

      /* DOM-rendered loading overlay. Sits on top of the stage until love.js
         flips #canvas visible. */
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        font-size: 1rem;
        color: #aaa;
        background: #000;
        text-align: center;
        padding: 1rem;
        pointer-events: none;
      }
      #loading.hidden { display: none; }
      #loading-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #333;
        border-top-color: #8ec3e3;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (min-width: 900px) and (min-aspect-ratio: 23 / 20) {
        #stage {
          width: min(100vw, calc(100vh * 1280 / 800));
          width: min(100dvw, calc(100dvh * 1280 / 800));
          height: min(100vh, calc(100vw * 800 / 1280));
          height: min(100dvh, calc(100dvw * 800 / 1280));
          max-width: min(100%, 1440px);
          max-height: min(100%, 900px);
        }
        #canvas, #loadingCanvas {
          aspect-ratio: 1280 / 800;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #loading-spinner { animation: none; border-top-color: #E3C06B; }
      }

    </style>
  </head>
  <body>
    <div id="stage">
      <!-- love.js expects both canvases in the DOM. loadingCanvas is hidden via CSS;
           we use the DOM #loading element for progress instead. -->
      <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()"></canvas>
      <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
      <div id="loading">
        <div id="loading-spinner"></div>
        <div id="loading-text">Loading…</div>
      </div>
      <div id="save-warning" role="status" hidden style="position:fixed;bottom:0;left:0;right:0;padding:10px;background:#4a3022;color:#fff4de;font:14px sans-serif;text-align:center;z-index:10">
        This browser could not save your expedition. Keep this page open to continue.
      </div>
    </div>

    <script type='text/javascript'>
      // Stock love.js shell expects drawLoadingText() on the loadingCanvas.
      // We redirect it to the DOM #loading-text element so progress is visible
      // on mobile (the stock loadingCanvas can draw progress offscreen).
      function drawLoadingText(text) {
        var el = document.getElementById('loading-text');
        if (el) el.textContent = text || 'Loading…';
      }

      window.onload  = function () { window.focus(); };
      window.onclick = function () { window.focus(); };

      // Block default scroll for game-relevant keys.
      window.addEventListener("keydown", function(e) {
        if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
      }, false);

      var HAS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
      var DESKTOP_LAYOUT = window.innerWidth >= 900
        && window.innerWidth / Math.max(1, window.innerHeight) >= 1.15;
      var REDUCED_MOTION = window.matchMedia
        && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var LOVE_ARGS = ["./game.love"];
      if (HAS_TOUCH) LOVE_ARGS.push("--touch");
      if (DESKTOP_LAYOUT) LOVE_ARGS.push("--desktop");
      if (REDUCED_MOTION) LOVE_ARGS.push("--reduced-motion");
      var QUERY = new URLSearchParams(window.location.search);
      var VERIFY = QUERY.get("verify") === "canonical";
      var SAVE_KEY = "collack.expedition.v1";
      var PREF_KEY = "collack.preferences.v1";
      if (VERIFY) {
        LOVE_ARGS.push("--verify-canonical");
      } else {
        if (/^\d{1,10}$/.test(QUERY.get("seed") || "")) LOVE_ARGS.push("--seed=" + QUERY.get("seed"));
        try {
          var saved = localStorage.getItem(SAVE_KEY);
          if (saved && saved.length <= 8 * 1024 * 1024) LOVE_ARGS.push("--saved-run=" + saved);
          var prefs = JSON.parse(localStorage.getItem(PREF_KEY) || "null");
          if (prefs && typeof prefs.muted === "boolean") LOVE_ARGS.push(prefs.muted ? "--saved-muted" : "--saved-sound");
          if (prefs && typeof prefs.reduced === "boolean") LOVE_ARGS.push(prefs.reduced ? "--saved-reduced" : "--saved-motion");
        } catch (_) {
          // Storage can be unavailable in private browsing; the game still runs.
        }
      }

      function gamePrint(message) {
        message = String(message);
        if (!VERIFY && message.indexOf("COLLACK_SAVE ") === 0) {
          try {
            localStorage.setItem(SAVE_KEY, message.slice(13));
            document.getElementById("save-warning").hidden = true;
          } catch (_) { document.getElementById("save-warning").hidden = false; }
          return;
        }
        if (!VERIFY && message.indexOf("COLLACK_PREF ") === 0) {
          var values = message.slice(13).split(" ");
          try { localStorage.setItem(PREF_KEY, JSON.stringify({ muted: values[0] === "true", reduced: values[1] === "true" })); } catch (_) {}
          return;
        }
        console.log(message);
      }

      var Module = {
        arguments: LOVE_ARGS,
        INITIAL_MEMORY: 67108864,
        print: gamePrint,
        printErr: console.error.bind(console),
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", function(e) {
            alert('WebGL context lost. You will need to reload the page.');
            e.preventDefault();
          }, false);
          return canvas;
        })(),
        setStatus: function(text) {
          if (text) {
            drawLoadingText(text);
          } else if (Module.remainingDependencies === 0) {
            // love.js init done — hide the DOM loader, reveal the canvas.
            var loading = document.getElementById('loading');
            if (loading) loading.classList.add('hidden');
            document.getElementById('canvas').style.visibility = 'visible';
          }
        },
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies: function(left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left
            ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')'
            : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading…');

      window.onerror = function(event) {
        Module.setStatus('Exception thrown — see JavaScript console');
        Module.setStatus = function(text) {
          if (text) Module.printErr('[post-exception status] ' + text);
        };
      };

      var applicationLoad = function(e) { Love(Module); }
    </script>
    <script type="text/javascript" src="__GAME_JS__"></script>
    <script async type="text/javascript" src="__LOVE_JS__" onload="applicationLoad(this)"></script>
  </body>
</html>
