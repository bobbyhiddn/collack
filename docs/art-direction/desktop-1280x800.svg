  <use href="#marble-a" transform="translate(604 161) scale(.75)"/>
  <circle cx="676" cy="161" r="26" fill="#18271F" stroke="#63B8A6" stroke-width="3"/>
  <use href="#marble-b" transform="translate(676 161) scale(.75)"/>
