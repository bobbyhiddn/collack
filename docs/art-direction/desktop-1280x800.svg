  <text x="1144" y="45" class="meta">VOLLEY 07</text>
  <circle cx="1217" cy="47" r="10" fill="#E3C06B"/><circle cx="1217" cy="47" r="4" fill="#241A14"/>

  <!-- Opponent arena -->
  <rect x="24" y="96" width="500" height="568" rx="16" class="felt" data-rect="opponent"/>
  <text x="48" y="128" fill="#63B8A6" class="heading">B · BRAM</text>
  <text x="48" y="148" class="meta">EFFECT AMPLIFIER · 12 BRICKS · 3 MARBLES</text>
  <text x="64" y="586" class="meta">OUTER RACK</text>
  <text x="408" y="586" class="meta">ROW 1 · FRONT</text>

  <use href="#sling-left" transform="translate(70 212)"/>
  <path d="M96 160V568" stroke="#B88636" stroke-width="6" stroke-linecap="round"/>
  <use href="#marble-b" transform="translate(96 186)"/>
  <use href="#marble-b" transform="translate(96 302) scale(.92)"/>
