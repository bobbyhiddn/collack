  <path d="M640 224V450" stroke="#E3C06B" stroke-width="4" stroke-linecap="round"/>
  <g fill="#E3C06B">
    <circle cx="640" cy="246" r="5"/><circle cx="640" cy="294" r="5"/><circle cx="640" cy="342" r="5"/><circle cx="640" cy="390" r="5"/><circle cx="640" cy="438" r="5"/>
  </g>
