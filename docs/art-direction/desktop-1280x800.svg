  </g>

  <path d="M1184 160V568" stroke="#B88636" stroke-width="6" stroke-linecap="round"/>
  <use href="#marble-a" transform="translate(1184 186)"/>
  <use href="#marble-a" transform="translate(1184 302) scale(.92)"/>
  <use href="#marble-a" transform="translate(1184 418) scale(.92)"/>
  <use href="#marble-a" transform="translate(1184 534) scale(.92)"/>
  <circle cx="1184" cy="244" r="23" fill="#18271F" stroke="#75492E" stroke-dasharray="4 3"/>
  <circle cx="1184" cy="360" r="23" fill="#18271F" stroke="#75492E" stroke-dasharray="4 3"/>
  <circle cx="1184" cy="476" r="23" fill="#18271F" stroke="#75492E" stroke-dasharray="4 3"/>
  <use href="#sling-right" transform="translate(1210 212)"/>

  <!-- Active A trajectory into B's row 1, lane 3. -->
  <path d="M1160 302C1010 250 832 250 720 286S540 318 476 302" fill="none" stroke="#E09A45" stroke-width="3" stroke-dasharray="8 6" opacity=".75"/>
  <circle cx="476" cy="302" r="32" fill="#E09A45" opacity=".12"/>
  <use href="#marble-a" transform="translate(476 302) scale(.72)"/>
  <path d="M494 287l12 15-18 3z" fill="#E09A45"/>

