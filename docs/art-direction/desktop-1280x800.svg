  <rect x="272" y="708" width="132" height="48" rx="8" class="felt"/><text x="299" y="738" class="body">SOUND ON</text>
  <text x="640" y="730" text-anchor="middle" class="body">Fen's Warden hits Aegis Keystone at row 1, lane 4 for 1</text>
  <text x="640" y="750" text-anchor="middle" class="meta">SPACE PAUSE · RIGHT STEP · M MUTE · R REPLAY SEED</text>
  <rect x="1060" y="708" width="172" height="48" rx="8" fill="#E3C06B" stroke="#F7E3A2"/>
  <text x="1095" y="738" class="button-text">OPEN LEDGER</text>
