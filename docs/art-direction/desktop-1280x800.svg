    <rect x="784" y="218" width="76" height="52" rx="7" fill="#756F68"/>
    <rect x="784" y="276" width="76" height="52" rx="7" fill="#5E8E86"/>
    <rect x="784" y="334" width="76" height="52" rx="7" fill="#C09A4A"/>
    <rect x="784" y="392" width="76" height="52" rx="7" fill="#5E8E86"/>
