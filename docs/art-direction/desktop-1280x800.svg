      <circle cx="15" cy="-14" r="6" fill="#E3C06B" stroke="#B88636" stroke-width="2"/>
      <circle cx="15" cy="14" r="6" fill="#E3C06B" stroke="#B88636" stroke-width="2"/>
      <path d="M15-14Q-3 0 15 14M16-11Q4 0 16 11" fill="none" stroke="#DAC8A7" stroke-width="2"/>
      <rect x="-8" y="-10" width="15" height="20" rx="5" fill="#241A14"/>
    </g>
    <g id="sling-right">
      <path d="M14-25L-15-14M14 25L-15 14" fill="none" stroke="#75492E" stroke-width="8" stroke-linecap="round"/>
      <circle cx="-15" cy="-14" r="6" fill="#E3C06B" stroke="#B88636" stroke-width="2"/>
      <circle cx="-15" cy="14" r="6" fill="#E3C06B" stroke="#B88636" stroke-width="2"/>
