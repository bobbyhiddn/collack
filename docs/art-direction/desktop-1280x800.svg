      <circle r="7" fill="#C1A05A"/><circle cx="-8" cy="-9" r="5" fill="#FFF4DE" opacity=".54"/>
      <circle cx="-13" cy="15" r="2.5" fill="#9A73B5"/><circle cx="-4" cy="19" r="2.5" fill="#9A73B5"/><circle cx="5" cy="19" r="2.5" fill="#9A73B5"/><circle cx="13" cy="15" r="2.5" fill="#9A73B5"/>
    </g>
    <g id="sling-left">
