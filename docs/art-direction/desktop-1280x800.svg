    <rect x="252" y="160" width="76" height="52" rx="7" fill="#18271F"/>
    <rect x="252" y="218" width="76" height="52" rx="7" fill="#B07142"/>
    <rect x="252" y="276" width="76" height="52" rx="7" fill="#C09A4A"/>
