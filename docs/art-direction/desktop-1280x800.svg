    <rect x="252" y="508" width="76" height="52" rx="7" fill="#18271F"/>
    <!-- row 2 -->
    <rect x="336" y="160" width="76" height="52" rx="7" fill="#5E8E86"/>
    <rect x="336" y="218" width="76" height="52" rx="7" fill="#18271F"/>
    <rect x="336" y="276" width="76" height="52" rx="7" fill="#C09A4A"/>
    <rect x="336" y="334" width="76" height="52" rx="7" fill="#B07142"/>
    <rect x="336" y="392" width="76" height="52" rx="7" fill="#C09A4A"/>
    <rect x="336" y="450" width="76" height="52" rx="7" fill="#18271F"/>
    <rect x="336" y="508" width="76" height="52" rx="7" fill="#5E8E86"/>
    <!-- row 1 -->
    <rect x="420" y="160" width="76" height="52" rx="7" fill="#5E8E86"/>
    <rect x="420" y="218" width="76" height="52" rx="7" fill="#756F68"/>
    <rect x="420" y="276" width="76" height="52" rx="7" fill="#8C6C9B"/>
    <rect x="420" y="334" width="76" height="52" rx="7" fill="#7EAD74"/>
    <rect x="420" y="392" width="76" height="52" rx="7" fill="#8C6C9B"/>
    <rect x="420" y="450" width="76" height="52" rx="7" fill="#756F68"/>
    <rect x="420" y="508" width="76" height="52" rx="7" fill="#5E8E86"/>
  </g>
  <g class="brick-label">
    <text x="290" y="250">SPL</text><text x="290" y="308">AEG</text><text x="290" y="366">BASE</text><text x="290" y="424">AEG</text><text x="290" y="482">CHN</text>
    <text x="374" y="192">FORT</text><text x="374" y="308">VOID</text><text x="374" y="366">VLT</text><text x="374" y="424">VOID</text><text x="374" y="540">FORT</text>
    <text x="458" y="192">REF</text><text x="458" y="250">BASE</text><text x="458" y="308">FRZ</text><text x="458" y="366">REG</text><text x="458" y="424">MAG</text><text x="458" y="482">BASE</text><text x="458" y="540">REF</text>
