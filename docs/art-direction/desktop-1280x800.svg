<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc" data-contract-version="1">
  <title id="title">Callack 1280 by 800 dual-arena desktop battle layout</title>
  <desc id="desc">Authored landscape reference with opponent and player arenas facing horizontally across a central event spine.</desc>
  <defs>
    <pattern id="felt" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#18271F"/>
      <path d="M3 6l4 1M14 3l3 2M9 15l5-1M1 18l3-1" stroke="#DAC8A7" stroke-opacity=".06"/>
    </pattern>
    <pattern id="wood" width="48" height="16" patternUnits="userSpaceOnUse">
      <rect width="48" height="16" fill="#4A3022"/>
      <path d="M0 4c11-3 25 4 48 0M0 12c17 2 29-3 48 0" fill="none" stroke="#75492E" stroke-opacity=".48"/>
    </pattern>
    <g id="marble-a">
      <circle r="23" fill="#0C0907" opacity=".38" transform="translate(3 3)"/>
      <circle r="22" fill="#AAB5B2" stroke="#5794BF" stroke-width="3"/>
      <path d="M-16 11C-7 0-12-9 2-17M-2 2l12-6M-7 8l8 9" fill="none" stroke="#F5E8CF" stroke-width="2" stroke-opacity=".7"/>
      <circle r="7" fill="#E3C06B"/><circle cx="-8" cy="-9" r="5" fill="#FFF4DE" opacity=".58"/>
      <circle cx="-9" cy="17" r="2.5" fill="#5794BF"/><circle cy="19" r="2.5" fill="#5794BF"/><circle cx="9" cy="17" r="2.5" fill="#5794BF"/>
    </g>
    <g id="marble-b">
