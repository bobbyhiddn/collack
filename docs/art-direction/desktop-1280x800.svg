      <rect x="-7" y="-10" width="15" height="20" rx="5" fill="#241A14"/>
    </g>
    <style>
      .felt { fill:url(#felt); stroke:#3A5B4D; stroke-width:1.5 }
      .wood { fill:url(#wood); stroke:#75492E; stroke-width:1.5 }
      .paper { fill:#F5E8CF; stroke:#DAC8A7 }
      .title { fill:#FFF4DE; font:700 24px ui-sans-serif,system-ui,sans-serif; letter-spacing:2px }
      .heading { fill:#FFF4DE; font:700 18px ui-sans-serif,system-ui,sans-serif }
      .body { fill:#FFF4DE; font:15px ui-sans-serif,system-ui,sans-serif }
      .meta { fill:#CBB995; font:11px ui-sans-serif,system-ui,sans-serif; letter-spacing:.8px }
      .brick-label { fill:#FFF4DE; font:700 10px ui-sans-serif,system-ui,sans-serif; text-anchor:middle }
      .button-text { fill:#241A14; font:700 14px ui-sans-serif,system-ui,sans-serif; letter-spacing:.7px }
      .panel-note { fill:#CBB995; font:10px ui-monospace,monospace }
