    <rect x="868" y="276" width="76" height="52" rx="7" fill="#8C6C9B"/>
    <rect x="868" y="334" width="76" height="52" rx="7" fill="#C09A4A"/>
    <rect x="868" y="392" width="76" height="52" rx="7" fill="#8C6C9B"/>
    <rect x="868" y="450" width="76" height="52" rx="7" fill="#5E8E86"/>
    <rect x="868" y="508" width="76" height="52" rx="7" fill="#18271F"/>
    <!-- row 3 -->
    <rect x="952" y="160" width="76" height="52" rx="7" fill="#18271F"/>
    <rect x="952" y="218" width="76" height="52" rx="7" fill="#18271F"/>
    <rect x="952" y="276" width="76" height="52" rx="7" fill="#C09A4A"/>
    <rect x="952" y="334" width="76" height="52" rx="7" fill="#B07142"/>
    <rect x="952" y="392" width="76" height="52" rx="7" fill="#B07142"/>
    <rect x="952" y="450" width="76" height="52" rx="7" fill="#18271F"/>
    <rect x="952" y="508" width="76" height="52" rx="7" fill="#18271F"/>
  </g>
  <g class="brick-label">
    <text x="822" y="192">DMY</text><text x="822" y="250">BASE</text><text x="822" y="308">ABS</text><text x="822" y="366">AEG</text><text x="822" y="424">ABS</text><text x="822" y="482">BASE</text><text x="822" y="540">DMY</text>
    <text x="906" y="250">FORT</text><text x="906" y="308">PSN</text><text x="906" y="366">TMP</text><text x="906" y="424">SHT</text><text x="906" y="482">FORT</text>
