# Dedicated Fly configuration for the candidate-owned paddle web release.
# The only approved entry point is scripts/release-paddle-fly.sh --deploy,
# which authenticates canonical dist/paddle-web before selecting this config
# and deploy/fly/Dockerfile.paddle explicitly from the repository root.

app = "collack-spike"
primary_region = "sjc"

[env]
  CALLACK_RELEASE_TARGET = "paddle-web"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
