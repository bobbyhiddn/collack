# Listen on Fly's expected internal port (8080) and serve the love.js bundle.
# - application/wasm is in nginx-alpine's default mime.types (no override needed).
# - .data is the love.js virtual-FS blob; serve as octet-stream.
# - No SharedArrayBuffer / threaded WASM in this build, so COOP/COEP not required.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The shell stays fresh while content-addressed runtime assets cache forever.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Nginx's config parser treats the quantifier's closing brace as syntax
    # unless the complete regular expression is quoted.
    location ~* "\.[0-9a-f]{16}\.(wasm|js|data)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Inherit /etc/nginx/mime.types from the parent http block (text/html for
    # .html, application/wasm for .wasm, application/javascript for .js, etc.).
    # Don't declare `types { ... }` here — that would *replace* the inherited
    # map, not extend it, and everything would fall through to default_type.
    # `.data` has no registered mime type and will correctly fall through to
    # the inherited default_type = application/octet-stream.

    location / {
        try_files $uri $uri/ =404;
    }
}
