# Root-only static service for the candidate-owned paddle release.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /srv/callack/paddle-web;
    index index.html;

    # The root route and provenance-bearing unversioned files must revalidate.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /callack-build-manifest.json {
        add_header Cache-Control "no-cache" always;
    }

    location = /callack-toolchain-identity.json {
        add_header Cache-Control "no-cache" always;
    }

    # Runtime filenames carry the first 16 hex characters of their SHA-256.
    location ~* "\.[0-9a-f]{16}\.(wasm|js|data)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The release contract is rooted at /. Never fall back from another base
    # path to index.html, because that could make a different target appear live.
    location / {
        try_files $uri $uri/ =404;
    }
}
